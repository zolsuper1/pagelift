<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Pagelift logo sheet</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #e9e7f2; color: #17123b; }
  main { max-width: 1000px; margin: 0 auto; padding: 32px 24px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; } p { margin: 0 0 20px; color: #5b5288; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .tile { border-radius: 12px; padding: 24px; display: grid; place-items: center; min-height: 140px; }
  .tile img { max-width: 100%; height: 64px; }
  .tile small { margin-top: 10px; font-size: 12px; opacity: .7; }
  .dark { background: #17123b; color: #fff1dc; } .white { background: #fff; } .cream { background: #fff1dc; }
  .sizes { display: flex; gap: 28px; align-items: end; padding: 24px; border-radius: 12px; }
  .sizes figure { margin: 0; text-align: center; font-size: 12px; }
</style></head>
<body><main>
  <h1>Pagelift logo sheet</h1>
  <p>Every file is pure vector paths: no web font, works as an image, in email and in design tools.</p>
  <div class="row">
    <div class="tile dark"><img src="logo.svg" alt="logo.svg"><small>logo.svg — dark backgrounds</small></div>
    <div class="tile white"><img src="logo-light.svg" alt="logo-light.svg"><small>logo-light.svg — white</small></div>
    <div class="tile cream"><img src="logo-light.svg" alt="logo-light.svg on cream"><small>logo-light.svg — cream paper</small></div>
  </div>
  <div class="row">
    <div class="tile white"><img src="logo-mono.svg" alt="logo-mono.svg"><small>logo-mono.svg — one colour</small></div>
    <div class="tile dark"><img src="mark.svg" alt="mark.svg" style="height:96px"><small>mark.svg — icon / avatar</small></div>
    <div class="tile white"><img src="favicon.svg" alt="favicon.svg" style="height:96px"><small>favicon.svg — built for 16–32px</small></div>
  </div>
  <div class="sizes white">
    <figure><img src="favicon.svg" width="16" height="16" alt=""><br>16</figure>
    <figure><img src="favicon.svg" width="32" height="32" alt=""><br>32</figure>
    <figure><img src="mark.svg" width="40" height="40" alt=""><br>40 (mark)</figure>
    <figure><img src="mark.svg" width="64" height="64" alt=""><br>64 (mark)</figure>
  </div>
</main></body></html>
